<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>REI DO APK - Premium Gold</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* =========================================
           CONFIGURAÇÕES DE DESIGN (ALTERE O FUNDO AQUI)
           ========================================= */
        :root {
            --config-fundo: url('https://i.supaimg.com/f39afda8-6b2e-4cf2-8ab9-b80ced5e2c75/ea4e5f51-4551-4889-85fd-ea25cfe87359.png');
            --cor-dourado: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
        }

        body { 
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), var(--config-fundo);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; 
        }

        .hs::-webkit-scrollbar { display: none; }

        /* --- ANIMAÇÃO DA INTRO --- */
        #intro-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .intro-text {
            font-size: 4rem; font-weight: 900; text-align: center;
            background: var(--cor-dourado); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; filter: drop-shadow(0 0 10px rgba(184, 134, 11, 0.5));
            animation: pullAndBurst 4s forwards cubic-bezier(0.5, 0, 0.5, 1);
        }
        @keyframes pullAndBurst {
            0% { transform: scale(0.8); letter-spacing: -5px; opacity: 0; }
            20% { opacity: 1; transform: scale(1); letter-spacing: 2px; }
            70% { transform: scaleX(3) scaleY(0.7); letter-spacing: 15px; opacity: 1; }
            85% { transform: scaleX(4) scaleY(0.4); opacity: 0.8; }
            100% { transform: scale(15); filter: blur(20px); opacity: 0; visibility: hidden; }
        }

        /* --- ANIMAÇÃO FLUTUANTE --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .pc-card, .category-card {
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .pc-card:hover, .category-card:hover { transform: scale(1.05); animation-play-state: paused; }

        .category-card {
            background: rgba(255, 255, 255, 0.05); border: 2px solid #bf953f;
            backdrop-filter: blur(10px); border-radius: 50%;
            width: 130px; height: 130px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer;
        }

        #marquee-rei {
            position: fixed; top: 64px; left: 0; width: 100%;
            background: linear-gradient(90deg, #e50914, #91060d); color: white; padding: 10px 0;
            font-weight: 900; z-index: 100; text-transform: uppercase; display: none; overflow: hidden; white-space: nowrap;
        }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee-anim 20s linear infinite; }
        @keyframes marquee-anim { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .ni.active { color: #bf953f; font-weight: 800; border-bottom: 3px solid #bf953f; }
        
        #player-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column;
        }
    </style>
</head>
<body class="pb-20 md:pb-0">

        </div>
        <div class="flex-1 flex items-center justify-center bg-black">
            <video id="video-element" class="w-full h-full hidden" controls></video>
            <iframe id="embed-element" class="w-full h-full hidden" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- APP CONTAINER -->
    <div id="app" class="pt-24 px-4 md:px-10 min-h-screen">

        <div id="grid-content" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 justify-items-center"></div>
    </div>

        /* ==========================================================================
           LÓGICA DO SISTEMA (NÃO ALTERAR A MENOS QUE SAIBA O QUE ESTÁ FAZENDO)
           ========================================================================== */

        function sw(tab) {
            const grid = document.getElementById('grid-content');
            const title = document.getElementById('section-title');
            grid.innerHTML = "";
            
            document.querySelectorAll('.ni, .md\\:hidden button').forEach(el => el.classList.remove('active', 'text-yellow-500'));
            document.getElementById('nav-' + tab)?.classList.add('active');
            document.getElementById('mob-' + tab)?.classList.add('text-yellow-500');

            if (tab === 'h') {
                title.innerText = "Escolha uma Categoria";
                grid.className = "flex flex-wrap justify-center gap-8";
                grid.innerHTML = `
                    <div onclick="sw('t')" class="category-card"><i data-lucide="tv" class="text-yellow-500 mb-2"></i><b>TV</b></div>
                    <div onclick="sw('m')" class="category-card"><i data-lucide="film" class="text-yellow-500 mb-2"></i><b>FILMES</b></div>
                    <div onclick="sw('s')" class="category-card"><i data-lucide="layers" class="text-yellow-500 mb-2"></i><b>SÉRIES</b></div>
                `;
                lucide.createIcons();
            } else {
                title.innerText = tab === 't' ? "Canais de TV Ao Vivo" : tab === 'm' ? "Filmes Lançamentos" : "Séries Completas";
                grid.className = "grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 w-full";
                const lista = tab === 't' ? MEUS_LINKS.tv : tab === 'm' ? MEUS_LINKS.filmes : MEUS_LINKS.series;
                renderGrid(lista);
            }
            window.scrollTo(0,0);
        }

        function renderGrid(data) {
            const grid = document.getElementById('grid-content');
            grid.innerHTML = data.map(item => `
                <div onclick="openPlayer('${item.url}', '${item.name}')" class="pc-card rounded-xl overflow-hidden cursor-pointer border border-white/10 bg-black/60 group">
                    <div class="relative aspect-[2/3]">
                        <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                        <p class="absolute bottom-2 w-full text-center text-[10px] font-bold uppercase truncate px-2">${item.name}</p>
                    </div>
                </div>
            `).join('');
        }

        function openPlayer(url, name) {
            if(!url) return alert("Link ainda não disponível neste canal/filme!");
            const overlay = document.getElementById('player-overlay');
            const video = document.getElementById('video-element');
            const embed = document.getElementById('embed-element');
            document.getElementById('player-title').innerText = name;
            overlay.style.display = "flex";
            
            if(url.includes('.m3u8') || url.includes('.mp4')) {
                embed.classList.add('hidden'); video.classList.remove('hidden');
                if (Hls.isSupported() && url.includes('.m3u8')) {
                    const hls = new Hls(); hls.loadSource(url); hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
                } else { video.src = url; video.play(); }
            } else {
                video.classList.add('hidden'); embed.classList.remove('hidden'); embed.src = url;
            }
        }

        function closePlayer() {
            document.getElementById('video-element').pause();
            document.getElementById('embed-element').src = "";
            document.getElementById('player-overlay').style.display = "none";
        }

        function gerenciarLetreiro() {
            const letreiro = document.getElementById('marquee-rei');
            setInterval(() => {
                letreiro.style.display = 'block';
                setTimeout(() => { letreiro.style.display = 'none'; }, 15000);
            }, 60000); 
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-screen').style.opacity = "0";
                setTimeout(() => {
                    document.getElementById('intro-screen').remove();
                    sw('h');
                    gerenciarLetreiro();
                }, 800);
            }, 4000);
        };
    </script>
