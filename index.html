<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>REI DO APK - Premium Gold</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* =========================================
           CONFIGURAÇÕES DE DESIGN (ALTERE O FUNDO AQUI)
           ========================================= */
        :root {
            --config-fundo: url('https://i.supaimg.com/f39afda8-6b2e-4cf2-8ab9-b80ced5e2c75/ea4e5f51-4551-4889-85fd-ea25cfe87359.png');
            --cor-dourado: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
        }

        body { 
            background-color: #0a0a0a;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), var(--config-fundo);
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; 
        }

        .hs::-webkit-scrollbar { display: none; }

        /* --- ANIMAÇÃO DA INTRO --- */
        #intro-screen {
            position: fixed; inset: 0; background: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .intro-text {
            font-size: 4rem; font-weight: 900; text-align: center;
            background: var(--cor-dourado); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; filter: drop-shadow(0 0 10px rgba(184, 134, 11, 0.5));
            animation: pullAndBurst 4s forwards cubic-bezier(0.5, 0, 0.5, 1);
        }
        @keyframes pullAndBurst {
            0% { transform: scale(0.8); letter-spacing: -5px; opacity: 0; }
            20% { opacity: 1; transform: scale(1); letter-spacing: 2px; }
            70% { transform: scaleX(3) scaleY(0.7); letter-spacing: 15px; opacity: 1; }
            85% { transform: scaleX(4) scaleY(0.4); opacity: 0.8; }
            100% { transform: scale(15); filter: blur(20px); opacity: 0; visibility: hidden; }
        }

        /* --- ANIMAÇÃO FLUTUANTE --- */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .pc-card, .category-card {
            animation: float 4s ease-in-out infinite;
            transition: all 0.3s ease;
        }
        .pc-card:hover, .category-card:hover { transform: scale(1.05); animation-play-state: paused; }

        .category-card {
            background: rgba(255, 255, 255, 0.05); border: 2px solid #bf953f;
            backdrop-filter: blur(10px); border-radius: 50%;
            width: 130px; height: 130px; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; cursor: pointer;
        }

        #marquee-rei {
            position: fixed; top: 64px; left: 0; width: 100%;
            background: linear-gradient(90deg, #e50914, #91060d); color: white; padding: 10px 0;
            font-weight: 900; z-index: 100; text-transform: uppercase; display: none; overflow: hidden; white-space: nowrap;
        }
        .marquee-content { display: inline-block; padding-left: 100%; animation: marquee-anim 20s linear infinite; }
        @keyframes marquee-anim { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }

        .ni.active { color: #bf953f; font-weight: 800; border-bottom: 3px solid #bf953f; }
        
        #player-overlay {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column;
        }
    </style>
</head>
<body class="pb-20 md:pb-0">

    <div id="intro-screen"><div class="intro-text">REI DO APK</div></div>

    <div id="marquee-rei">
        <div class="marquee-content text-xl">
            🚀 REI DO APK - O MELHOR DO STREAMING 🚀 FILMES, SÉRIES E TV ONLINE 🚀 QUALIDADE PREMIUM 🚀
        </div>
    </div>

    <!-- NAVBAR -->
    <nav class="fixed top-0 w-full z-40 bg-black/80 backdrop-blur-md border-b border-white/10 px-4 md:px-10 h-16 flex items-center justify-between">
        <h1 class="text-red-600 text-2xl font-black cursor-pointer" onclick="sw('h')">REI DO<span class="text-white"> APK</span></h1>
        <ul class="hidden md:flex gap-8 text-sm uppercase font-bold">
            <li class="ni cursor-pointer" id="nav-h" onclick="sw('h')">Início</li>
            <li class="ni cursor-pointer" id="nav-t" onclick="sw('t')">TV</li>
            <li class="ni cursor-pointer" id="nav-m" onclick="sw('m')">Filmes</li>
            <li class="ni cursor-pointer" id="nav-s" onclick="sw('s')">Séries</li>
        </ul>
    </nav>

    <!-- PLAYER OVERLAY -->
    <div id="player-overlay">
        <div class="flex items-center justify-between p-4 bg-[#0f0f0f]">
            <h3 id="player-title" class="font-bold text-yellow-500">REI DO APK PLAYER</h3>
